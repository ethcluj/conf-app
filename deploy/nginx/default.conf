server {
    listen 80;
    server_name app.ethcluj.org;

    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server configuration
server {
    listen 443 ssl;
    http2 on;
    server_name app.ethcluj.org;

    ssl_certificate /etc/letsencrypt/live/app.ethcluj.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ethcluj.org/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    # UI
    location / {
        # Authentication is enabled if .htpasswd file contains credentials
        # Empty or missing file disables authentication
        auth_basic "ETHCluj Conference QnA";
        auth_basic_user_file /etc/nginx/deploy/.htpasswd;
        proxy_pass http://ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api {
        # Authentication is enabled if .htpasswd file contains credentials
        # Empty or missing file disables authentication
        auth_basic "ETHCluj Conference QnA";
        auth_basic_user_file /etc/nginx/deploy/.htpasswd;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name ethcluj.org www.ethcluj.org;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
